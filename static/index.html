
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>CS 568 - Speed Testing</title>
    <script src="/static/app.js" defer></script>
</head>
<body>
    <main>
        <h1>Speed Testing</h1>
        <p>Tarayıcı ile sunucu arasındaki HTTP hız testi.</p>

        <button id="startAll">Testi Başlat</button>

        <p id="overallStatus" aria-live="polite">
            Test bekleniyor.
        </p>

        <progress id="overallProgress"
                  value="0" max="3"
                  aria-label="Test ilerlemesi"></progress>

        <section>
            <h2>Ping</h2>
            <p id="pingStatus">Bekliyor</p>
            <output id="pingResult">-- ms</output>
            <p id="pingDetails"></p>
        </section>

        <section>
            <h2>Download</h2>
            <p id="downloadStatus">Bekliyor</p>
            <output id="downloadResult">-- Mbps</output>
            <p id="downloadDetails"></p>
        </section>

        <section>
            <h2>Upload</h2>
            <p id="uploadStatus">Bekliyor</p>
            <output id="uploadResult">-- Mbps</output>
            <p id="uploadDetails"></p>
        </section>

        <section>
            <h2>Veri Kullanımı</h2>
            <p id="totalDownloaded">İndirilen: -- MB</p>
            <p id="totalUploaded">Yüklenen: -- MB</p>
            <p id="totalTransferred">Toplam: -- MB</p>
        </section>
    </main>
</body>
</html>
