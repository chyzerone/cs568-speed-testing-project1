
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 568 - Speed Testing</title>
    <script src="/static/app.js" defer></script>
</head>
<body>
    <main>
        <h1>Speed Testing</h1>

        <p>Tarayıcı ile sunucu arasındaki HTTP gecikmesini ölç.</p>

        <button id="startPing">Ping Testini Başlat</button>

        <p id="status" aria-live="polite">Test bekleniyor.</p>

        <h2>Ping Sonucu</h2>
        <output id="pingResult">-- ms</output>

        <p id="dataUsage"></p>

        <section>
            <h2>Download Speed Test</h2>

            <button id="startDownload">
                Download Testini Başlat
            </button>

            <p id="downloadStatus" aria-live="polite">
                Download testi bekleniyor.
            </p>

            <p>
                İndirme hızı:
                <output id="downloadResult">-- Mbps</output>
            </p>

            <p id="downloadDetails"></p>
        </section>

        <section>
            <h2>Upload Speed Test</h2>

            <button id="startUpload">
                Upload Testini Başlat
            </button>

            <p id="uploadStatus" aria-live="polite">
                Upload testi bekleniyor.
            </p>

            <p>
                Yükleme hızı:
                <output id="uploadResult">-- Mbps</output>
            </p>

            <p id="uploadDetails"></p>
        </section>
    </main>
</body>
</html>
